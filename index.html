<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Feedback</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Student Feedback</h1>
    <p class="subtitle">Share your learning experience.</p>

    <form id="feedback-form" novalidate>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" required maxlength="60" />

      <label for="course">Course</label>
      <input id="course" name="course" type="text" required maxlength="80" />

      <label for="feedback">Feedback</label>
      <textarea id="feedback" name="feedback" required maxlength="500" rows="5"></textarea>

      <p id="error-message" class="error" role="alert" aria-live="polite"></p>
      <button type="submit">Submit feedback</button>
    </form>

    <section aria-labelledby="feedback-heading">
      <h2 id="feedback-heading">Submitted Feedback</h2>
      <div id="feedback-list" class="feedback-list"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
